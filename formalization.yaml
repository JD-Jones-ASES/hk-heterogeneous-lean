automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5 (Anthropic)", "Claude Fable 5.1 (Anthropic)"]
      framework: "Claude Code with parallel subagents"
      tool_setup: >-
        The project was directed by its author. Claude Fable 5.1 pinned the statements, split and merged
        the proof files and edited the documents; Claude Opus 5.5 subagents wrote the proofs, the
        checkers and the drafts. Claude (Anthropic) in Claude Code was used throughout: the statements
        and their fidelity checks against both papers, the Lean proofs, the exact-arithmetic replays and
        searches outside Lean (which found the five- and six-agent systems), the literature and
        prior-art searches, and the repository text. Lean v4.35.0-rc2 and Mathlib v4.35.0-rc2 (commit
        065356127b1dc0016f66b7283ce0ce2c4055aa55) are pinned by the committed manifest and lake update
        is never run; there are no GitHub Actions workflows. There is no native_decide. The proofs are
        linear arithmetic over the offset atom lambda^t with fin_cases neighbourhood tables,
        linear_combination with the quadratic identities of sqrt 5, sqrt 2 and sqrt 249, inductions on t
        for the closed forms, and the limit lemmas of Mathlib (among them limUnder of a convergent
        sequence); decide is used only for inequalities between Fin indices.
      spend_usd: "not tracked"

fidelity:
  divergences: >-
    Agents are indexed from 0: the paper's agent i is index i - 1 throughout (the docstrings give both).
    Each conjecture and the theorem is split into a statement for one model and n agents
    (Conjecture22ForAgents, Conjecture23ForAgents, Theorem64ivForAgents, Theorem64ivLiteralForAgents),
    one for a model and every n (the ...For forms) and one for both models; the source's statement is
    the last (for all models and all n), and the refutations are proved at every level, the per-model
    ones being stronger. Pseudo-stability after tau (Mirtabatabaei–Bullo (2.2)) is pinned with the
    convergence built in and with the "or" of the converging class taken at each t; with the strict
    inequalities towards the limit, this is equivalent to the per-agent reading of Hegarty, Ognissanti
    and Wedin (a side chosen at tau persists), so the refutations have the same strength under both.
    perStepFactor is a total function (division by zero gives 0 in Lean); it is evaluated only at agents
    whose offset from the final value at constant topology is nonzero at every t. fvct (Definition 3.1)
    is limUnder of A(y)^t y, which is the limit wherever it exists, and it exists at every point where a
    compared theorem evaluates it. The equi-topology distance (Definition 4.1(i)) is half the infimum of
    the finite set of values; for n = 1 the set is empty and sInf of the empty set is 0 on the reals.
    Lemmas 4.2 and 4.8 are stated without positivity of the bounds (no step of the source's proofs uses
    it), so they are slightly more general than the source; Lemma 4.8's single time T is two
    existentials, one per conclusion (equivalent by taking the maximum). Theorem 6.4(iv) is stated in
    its literal reading, which is refuted trivially (both classes of (2.2) must be non-empty, so a
    single frozen agent with a constant digraph violates it, as footnote 1 of Hegarty, Ognissanti and
    Wedin observes), and in the reading that admits a fixed state, whose refutation needs the
    constant-digraph systems. For Theorem 6.4(iii) its statement is not formalized; what is formalized
    is the per-step factor along the four constant-digraph systems (identically the negative rate; for
    the two source systems also that it converges to no non-negative number) and the two spectator
    configurations of Hegarty, Ognissanti and Wedin (closed forms, tables, the spectator's side). The
    data (initial opinions, bounds, limits, offset directions and rates) are as in the source, with the
    factor 1/2 of the Section 3 closed form x(t) = x_inf + (lambda^t / 2) v kept; the Section 5 closed
    form has no such factor.

review:
  status: "self-assessed"
  notes: >-
    No independent human expert review and no source-author endorsement is claimed; AI agents developed
    the proofs and audited them in separate passes, the statements were checked against Mirtabatabaei
    and Bullo's arXiv text (v2) and Hegarty, Ognissanti and Wedin's paper, and every data vector and
    neighbourhood table was replayed outside Lean in exact arithmetic. Mechanical correctness and
    agreement of formal statements do not establish priority or significance.

