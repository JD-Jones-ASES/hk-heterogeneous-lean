version: "v0.4"

project:
  name: "Heterogeneous Hegselmann–Krause dynamics: SBC and SBI systems whose proximity digraph is never eventually constant, and constant-digraph systems whose convergence is never pseudo-stable, refuting Conjectures 2.2 and 2.3 and Theorem 6.4(iv) of Mirtabatabaei–Bullo; their Lemmas 4.2 and 4.8"
  description: >-
    A Lean 4 development of the counterexamples of Hegarty, Ognissanti and Wedin (arXiv:2610.03229) to
    two conjectures and a theorem of Mirtabatabaei and Bullo on heterogeneous Hegselmann–Krause
    dynamics. n agents with real opinions and positive bounds r_1, ..., r_n update synchronously, x(t+1)
    = A(x(t)) x(t), where row i of A(y) averages uniformly over the neighbourhood N_i(y): the j with
    |y_i - y_j| <= r_i in the SBC model (synchronized bounded confidence) and <= r_j in the SBI model
    (synchronized bounded influence). Conjecture 2.2 says the proximity digraph is constant after a
    finite time; Conjecture 2.3 says every trajectory reaches a fixed state or is eventually
    pseudo-stable (the agents split into two non-empty classes, fixed at their limits or moving strictly
    towards them from one side); Theorem 6.4(iv) says a trajectory whose digraph is constant from some
    time on is eventually pseudo-stable. For the four systems of the source (SBC with seven agents and
    rate -1/6; SBI with seven agents and rate (1 - sqrt 5)/8; SBC with six agents; a second SBI system
    with seven agents) the development proves the closed form x(t) = x_inf + c lambda^t v for every t,
    the neighbourhood of every agent at every t (alternating with the parity of t at the middle agent of
    the two seven-agent alternating systems, the same at every t in the other two), convergence, and
    that no trajectory is ever frozen or pseudo-stable after any time towards any vector, since four
    agents alternate sides of their limits. Hence Conjectures 2.2 and 2.3 fail in each model, and
    Theorem 6.4(iv) fails in each model, both in its literal reading and in the reading that also admits
    a fixed state. Two smaller constant-digraph systems found in this development, five SBC agents with
    rate (1 - sqrt 2)/3 and six SBI agents with rate (13 - sqrt 249)/40, show that Conjecture 2.3 and
    Theorem 6.4(iv) fail already with five SBC agents and six SBI agents. Along all four source systems
    the final value at constant topology (Definition 3.1) of every x(t) is the limit, and in the two
    constant-digraph source systems the per-step convergence factor (Definition 6.1) of every agent with
    nonzero offset is identically the negative rate, so it converges to no non-negative number. On the
    positive side, Lemma 4.2 (the equi-topology neighbourhood preserves the proximity digraph) and Lemma
    4.8 (a convergent trajectory whose limit has every equi-topology distance positive eventually has
    the digraph of its limit, the limit as its final value at constant topology, and an equilibrium
    limit) are proved for arbitrary bounds; the limits of the two constant-digraph systems satisfy that
    hypothesis, and those of the two alternating systems violate it. For the source's two spectator
    systems (nine SBC agents with a spectator and two beacons; eight SBI agents with a spectator) the
    closed forms, the constant tables and the spectator's side are proved, and along the two smaller
    systems too the final value at constant topology is the limit and the per-step factor is the rate.
    Not claimed: Theorem 6.4(iii) in full, Conjecture 2.1 (convergence of every trajectory), or that any
    system is the smallest of its kind.
  authors: ["JD Jones"]
  responsible_maintainers: ["JD Jones"]
  license: "MIT"

