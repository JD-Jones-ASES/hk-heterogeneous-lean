  - title: "Partial convergence of heterogeneous Hegselmann-Krause opinion dynamics"
    authors: ["Wei Su", "YaJuan Gu", "Sha Wang", "YongGuang Yu"]
    id: "doi:10.1007/s11431-016-0615-x"
    type: "paper"
    location: "Science China Technological Sciences 60 (2017), no. 9, 1433-1438 (online 2017-05-02)"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Proves that in the heterogeneous Hegselmann-Krause (SBC) dynamics some agents, the extremal ones,
      reach static states in finite time; Hegarty, Ognissanti and Wedin note that the proof carries over
      to SBI, so that what remained open in Conjecture 2.3 concerned the agents that never freeze.
      Background only; nothing from it is formalized.
