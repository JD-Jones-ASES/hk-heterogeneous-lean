sources:
  - title: "Non-freezing of the proximity digraph and non-pseudostable convergence in heterogeneous Hegselmann--Krause models: Counterexamples to conjectures and results of Mirtabatabaei and Bullo"
    authors: ["Peter Hegarty", "Damiano Ognissanti", "Edvin Wedin"]
    id: "https://arxiv.org/abs/2610.03229"
    type: "paper"
    location: "arXiv:2610.03229v1 (2026-10-02; math.DS, math.CO; MSC 39A60, 93A14, 91D10, 91D30; 10 pages): Section 1 (the SBC and SBI models; Conjectures 2.2 and 2.3 and Theorem 6.4(iv) of Mirtabatabaei-Bullo as restated, with footnote 1 on the literal reading of 6.4(iv)); Section 2 (SBC, seven agents); Section 3 (SBI, seven agents); Section 4 (SBC, six agents, and the nine-agent spectator system with two beacons, Claims 1-3); Section 5 (SBI, seven agents, and the eight-agent spectator system, Claims 1-3); Section 6 (equi-topology distance zero at the limits of Sections 2 and 3); Section 7 (the AI statement)"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      The counterexamples formalized. The four systems (Section 2: SBC, n = 7, rate -1/6; Section 3: SBI,
      n = 7, rate (1 - sqrt 5)/8; Section 4: SBC, n = 6; Section 5: SBI, n = 7) are restated with the
      paper's initial opinions and bounds, and what the paper proves about each is proved here as it is
      stated there: the closed form x(t) = x_inf + c lambda^t v for every t (c = 1/2 in Section 3) (the paper's induction on t),
      the neighbourhood of every agent at every t (alternating with the parity of t at the middle agent
      in Sections 2 and 3, the same at every t in Sections 4 and 5), convergence, and the failure of
      Conjectures 2.2 and 2.3 and of Theorem 6.4(iv), the last in both the literal reading and the reading
      that admits freezing (footnote 1). The relationship is "formalizes" because the objects, the claims
      and the route of proof are the paper's, with two departures recorded under fidelity: agents are
      indexed from 0 (the paper's agent i is index i - 1), and for Theorem 6.4(iii), whose statement the
      paper leaves to Mirtabatabaei-Bullo, what is proved is that the per-step convergence factor of the
      open-minded agents of the Section 4 and Section 5 systems is identically the negative rate, so it
      converges to no non-negative number; the strongly connected components, leader components and
      spectral radii of Definition 6.3 are not formalized. Section 6's observation that the limits of
      Sections 2 and 3 have equi-topology distance zero at the alternating agents is proved
      (equiTopologyDistance_eq_zero). The spectator systems of Sections 4 and 5 (Claims 1-3: closed forms, tables, the spectator strictly on one side of its limit) are formalized too. Not formalized: the statement of Theorem 6.4(iii)(b) about leader components, and Section 6's genericity discussion. By Section 7 the examples were found by Claude Opus 5.5 at the authors'
      prompting and checked by hand by the authors; the text of the paper is the authors'.
  - title: "Opinion Dynamics in Heterogeneous Networks: Convergence Conjectures and Theorems"
    authors: ["Anahita Mirtabatabaei", "Francesco Bullo"]
    id: "doi:10.1137/11082751X"
    type: "paper"
    location: "SIAM Journal on Control and Optimization 50 (2012), no. 5, 2763-2785 (online 2012-09-13); the text read is arXiv:1103.2829v2 (2011-04-07): Section 2 (the SBC and SBI digraphs, the system (2.1) and its adjacency matrix, Conjectures 2.1-2.3, pseudo-stable behaviour (2.2)), Definition 3.1 (final value at constant topology) and the definition of an equilibrium opinion vector before it, Definition 4.1(i) (equi-topology distance and neighbourhood), Lemma 4.2, Lemma 4.8, Definition 6.1 (per-step convergence factor), Theorem 6.4(iii)-(iv)"
    relationship: "adapts"
    author_endorsement: "not-contacted"
    note: >-
      Takes the source's setting and proves the negation of its Conjecture 2.2 (the proximity digraph is
      constant after a finite time) and Conjecture 2.3 (every trajectory reaches a fixed state or is
      eventually pseudo-stable), each for the SBC model and for the SBI model separately, and the
      negation of its Theorem 6.4(iv) (a trajectory whose digraph is constant from some time on is
      eventually pseudo-stable), in the literal reading and in the reading that also admits a fixed
      state, through the systems of Hegarty, Ognissanti and Wedin above. The definitions are restated
      from Section 2 (the neighbourhoods N_i(y) with the non-strict inequality, the adjacency matrix, the
      system (2.1), the proximity digraph G_r(y), pseudo-stable behaviour after tau as in (2.2) with both
      classes non-empty), Definition 3.1 (fvct, the limit of A(y)^t y), Definition 4.1(i) (the
      equi-topology distance and neighbourhood) and Definition 6.1 (the per-step convergence factor). Two
      of the source's positive results are proved, not refuted: Lemma 4.2 (a point of the equi-topology
      neighbourhood of z has the proximity digraph of z) and Lemma 4.8 (a convergent trajectory whose
      limit has every equi-topology distance positive has, from some time on, the digraph of its limit,
      the limit as its final value at constant topology, and the limit is an equilibrium opinion
      vector), with the sharpness of 4.8's hypothesis at the two alternating systems. Conjecture 2.1
      (every trajectory converges) is not addressed. The published SIAM text was not read (its landing
      page refused automated access); the numbering used is that of the arXiv version, which agrees with
      the numbering Hegarty, Ognissanti and Wedin cite from the journal. The development also
      exhibits two smaller constant-digraph systems of its own (five SBC agents, six SBI agents)
      along which Conjecture 2.3 and Theorem 6.4(iv) fail in the same way.
