    location: "Complexity 15 (2010), no. 4, 43-52 (online 2009-11-25)"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      The Hegselmann-Krause model with heterogeneous bounds of confidence, which Mirtabatabaei and Bullo
      call the SBC model and Hegarty, Ognissanti and Wedin attribute to this paper. Background only;
      nothing from it is formalized.
  - title: "Attitude Dynamics With Limited Verbalisation Capabilities"
    authors: ["Diemo Urbig"]
    id: "https://www.jasss.org/6/1/2.html"
    type: "paper"
    location: "Journal of Artificial Societies and Social Simulation 6 (2003), no. 1, article 2 (published 2003-01-31); paragraph 4.14"
    relationship: "background"
