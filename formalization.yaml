status:
  scope: >-
    Sixty-three compared theorems over the definitions of Challenge.lean, none of them a hole. For the
    four systems of Hegarty, Ognissanti and Wedin (SBC with seven and with six agents, SBI with seven
    agents twice): the closed form of the trajectory for every t, the neighbourhood table at every t,
    convergence to the stated limit, a proximity digraph that is never eventually constant (the two
    alternating systems) or the same at every t (the other two), no fixed state from any time on and no
    pseudo-stability after any time towards any vector; hence the negations of Mirtabatabaei and Bullo's
    Conjecture 2.2 and Conjecture 2.3, each for the SBC model and for the SBI model, and of their
    Theorem 6.4(iv) in each model, in the reading admitting fixed states and in the literal reading (the
    latter is implied by the former, and also fails trivially for one frozen agent, a remark not used in
    the proof). For two smaller constant-digraph systems of this development (five SBC agents, rate (1 -
    sqrt 2)/3; six SBI agents, rate (13 - sqrt 249)/40): the same facts, so Conjecture 2.3 and Theorem
    6.4(iv) fail with five SBC agents and with six SBI agents, and Conjecture 2.2 with seven agents in
    each model. For the source's two spectator systems (Section 4: nine SBC agents with a spectator and
    two beacons; Section 5: eight SBI agents with a spectator) the closed forms with two geometric
    terms, the constant neighbourhood tables and the spectator strictly on one side of its limit for
    every t >= 1 are proved. The final value at constant topology of every x(t) is the limit along the
    four counterexample systems and the two smaller ones; the per-step convergence factor of the agents
    with nonzero offset in the six-agent SBC system (indices 1 to 4) and the second seven-agent SBI
    system (indices 1, 2, 4, 5) is identically the negative rate, so it converges to no non-negative
    number, and along the two smaller systems it is identically the rate as well. Mirtabatabaei and
    Bullo's Lemma 4.2 and Lemma 4.8 (both parts, with the equilibrium) are proved for arbitrary bounds;
    every equi-topology distance of the limits of the two constant-digraph systems is positive, and the
    limits of the two alternating systems have equi-topology distance 0 at indices 2, 3, 4 (SBC) and 1,
    3, 5 (SBI). Not claimed: Theorem 6.4(iii) in full (the strongly connected components, leader
    components and spectral radii of Definition 6.3 are not formalized; only the per-step factors above
    are); Conjecture 2.1 (every trajectory converges), on which nothing here bears; minimality of any
    system (computations outside Lean that bear on the least number of agents are confined to
    trajectories of the form x_inf + lambda^t v with a fixed neighbourhood pattern for each sign of
    lambda^t, and are not part of the formalization). The intentional placeholders of Challenge.lean are
    excluded from proof counts; Solution.lean does not import Challenge.lean.
